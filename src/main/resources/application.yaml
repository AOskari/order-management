spring:
  application:
    name: order-management
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
  flyway:
    url: ${DB_URL}
    user: ${DB_OWNER_USER}
    password: ${DB_OWNER_PASSWORD}
    schemas: public
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
          audiences: order-management-api
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
